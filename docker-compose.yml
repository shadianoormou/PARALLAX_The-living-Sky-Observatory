services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: parallax-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or your shell}"
    ports:
      - "1433:1433"
    volumes:
      - parallax_sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  science:
    build:
      context: .
      dockerfile: services/science/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Parallax;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ScienceService__BaseUrl: http://science:8001/
      PARALLAX_APPLY_MIGRATIONS: "true"
      PARALLAX_CORS_ORIGINS: http://localhost:3000
    ports:
      - "5080:5080"
    depends_on:
      sqlserver:
        condition: service_healthy
      science:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  parallax_sqlserver:
