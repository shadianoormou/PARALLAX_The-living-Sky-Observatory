services:
  postgres:
    image: postgres:16-alpine
    container_name: parallax-postgres
    environment:
      POSTGRES_DB: parallax
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your shell}"
    ports:
      - "5432:5432"
    volumes:
      - parallax_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax -d parallax"]
      interval: 10s
      timeout: 5s
      retries: 20

  science:
    build:
      context: .
      dockerfile: services/science/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:5080
      PARALLAX_DATABASE_PROVIDER: postgres
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=parallax;Username=parallax;Password=${POSTGRES_PASSWORD}"
      ScienceService__BaseUrl: http://science:8001/
      PARALLAX_APPLY_MIGRATIONS: "true"
      PARALLAX_CORS_ORIGINS: "${PARALLAX_CORS_ORIGINS:-http://localhost:3000}"
      PARALLAX_REQUIRE_API_KEY: "${PARALLAX_REQUIRE_API_KEY:-false}"
      PARALLAX_API_KEY: "${PARALLAX_API_KEY:-}"
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy
      science:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  parallax_postgres:
